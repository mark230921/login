<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #f4f4f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }
    .login-card { 
      background: white; 
      padding: 30px; 
      border-radius: 24px; 
      border: 2px solid #333;
      box-shadow: 0 8px 0px rgba(0,0,0,0.9); 
      width: 300px; 
      text-align: center;
    }
    input { 
      width: 100%; 
      padding: 10px 5px; 
      margin-bottom: 20px; 
      border: none; 
      border-bottom: 2px solid #ccc; 
      text-align: center;
      outline: none;
    }
    button { 
      width: 50%; 
      padding: 10px; 
      background: #fff; 
      border: 2px solid #333; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: bold;
      box-shadow: 0 3px 0px #333;
    }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0px #333; }
    #message { margin-top: 15px; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>NEAR EX PROJECT</h2>
    <h3>LOG IN</h3>
    
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    
    <button onclick="handleLogin()">Login</button>
    <div id="message"></div>
  </div>

  <script>
    function handleLogin() {
      var user = document.getElementById('username').value;
      var pass = document.getElementById('password').value;
      var msgDiv = document.getElementById('message');
      
      msgDiv.style.color = '#666';
      msgDiv.innerText = 'Checking...';

      // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
      var scriptURL = 'https://script.google.com/macros/s/AKfycbzPREVVGhdjOMuTDkr2mvzPR4wZmXwRLzcR9TKz412V52Ef_RcWcSh4PDiKylwNwTwXuQ/exec'; 

      var targetURL = scriptURL + '?username=' + encodeURIComponent(user) + '&password=' + encodeURIComponent(pass);

      fetch(targetURL)
        .then(response => response.json())
        .then(result => {
          if (result.success) {
            msgDiv.style.color = 'green';
            msgDiv.innerText = result.message + ' Redirecting...';
            setTimeout(function() {
              window.location.href = 'https://mark230921.github.io/near-ex-3.0/'; // Change to your destination page
            }, 1000);
          } else {
            msgDiv.style.color = 'red';
            msgDiv.innerText = result.message;
          }
        })
        .catch(error => {
          msgDiv.style.color = 'red';
          msgDiv.innerText = 'Connection error. Try again.';
        });
    }
  </script>
</body>
</html>
